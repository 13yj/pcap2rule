# Pcap2Rule — Global Default Configuration
# All paths are relative to the project root unless absolute.

experiment:
  name: "pcap2rule_main"
  seed: 42
  seeds: [42, 123, 456, 789, 1024]  # for multi-seed evaluation
  output_dir: "./rules"
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"

data:
  dataset: "CSE-CIC-IDS2018"  # or CIC-IDS2017
  data_dir: "./data"
  num_attack_samples: 500
  num_benign_samples: 200
  train_days: null   # dataset-specific
  test_days: null
  max_payload_bytes: 512
  max_prompt_tokens: 2048
  max_rule_tokens: 512

features:
  flow:
    dimensions: 38
    enabled: true
    temporal: true    # duration, IAT stats
    volumetric: true  # packet/byte counts
    flags: true       # TCP flag distributions
    protocol: true    # app protocol identification
  payload:
    enabled: true
    http_parse: true
    dns_parse: true
    hex_fallback: true

rag:
  k_exemplars: 3
  alpha: 0.6  # weight for type vs. structural similarity
  type_embedding_dim: 768
  sig_embedding_dim: 384
  faiss:
    n_centroids: 256
    code_size: 64
    n_probe: 8
  model:
    type_encoder: "sentence-transformers/all-mpnet-base-v2"
    use_gpu: true

llm:
  model_name: "Qwen/Qwen2-7B-Instruct"
  load_in_4bit: true
  use_vllm: true
  vllm:
    tensor_parallel_size: 1
    max_model_len: 4096
    gpu_memory_utilization: 0.90

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj"]
  learning_rate: 2.0e-4
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.1
  lr_scheduler: "cosine"
  max_grad_norm: 1.0
  weight_decay: 0.01

validation:
  max_iterations: 3
  semantic_threshold: 0.6
  fpr_threshold: 0.05
  benign_eval_size: 200
  suricata_binary: "suricata"  # path or command name
  suricata_timeout: 30  # seconds
  bi_encoder:
    model_name: "sentence-transformers/all-mpnet-base-v2"
    embedding_dim: 768
    temperature: 0.07
    num_negatives: 8

generalization:
  abstract_ips: true
  abstract_ports: true
  generalize_pcre: true
  sqli_expansion: true
  xss_expansion: true

xgboost:
  max_depth: 6
  n_estimators: 100
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8

evaluation:
  bootstrap_samples: 10000
  confidence_level: 0.95
  mcnemar_alpha: 0.01

robustness:
  perturbations:
    payload_obfuscation: true
    timing_perturbation: true
    flow_fragmentation: true
    protocol_mimicry: true
  timing_jitter_pct: 0.5

logging:
  level: "INFO"
  wandb:
    enabled: false
    project: "pcap2rule"
    entity: null
