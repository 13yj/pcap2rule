# Parameter Sensitivity Analysis Configuration (Fig.2)

experiment:
  name: "parameter_sensitivity"
  description: "Hyperparameter grid search for 5 key parameters"

parameters:
  lora_rank:
    values: [4, 8, 16, 32, 64]
    default: 16

  rag_k:
    values: [1, 2, 3, 5, 7]
    default: 3

  max_iterations:
    values: [1, 2, 3, 4, 5]
    default: 3

  temperature:
    values: [0.1, 0.3, 0.5, 0.7, 0.9]
    default: 0.3

  semantic_threshold:
    values: [0.4, 0.5, 0.6, 0.7, 0.8]
    default: 0.6
